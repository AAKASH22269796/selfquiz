<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    <h1>Quiz App</h1>
    <h2 id="timer" style="text-align:center; color:white; display:none;"></h2>
    
    <div id="start-screen" class="start-box">
        <input type="text" id="username" placeholder="Enter your name">
        
        <div class="mode-selection">
            <label>
                <input type="radio" name="quiz-mode" value="shuffle" checked onchange="toggleUnitSelect()">
                <span>Shuffle Solve (All Units)</span>
            </label>
            <label>
                <input type="radio" name="quiz-mode" value="unit" onchange="toggleUnitSelect()">
                <span>Solve Unit Wise</span>
            </label>
        </div>

        <select id="unit-select" style="display:none;">
            <option value="" disabled selected>Select Week (0-12)</option>
            <option value="0">Week 0</option>
            <option value="1">Week 1</option>
            <option value="2">Week 2</option>
            <option value="3">Week 3</option>
            <option value="4">Week 4</option>
            <option value="5">Week 5</option>
            <option value="6">Week 6</option>
            <option value="7">Week 7</option>
            <option value="8">Week 8</option>
            <option value="9">Week 9</option>
            <option value="10">Week 10</option>
            <option value="11">Week 11</option>
            <option value="12">Week 12</option>
        </select>

        <input type="number" id="num" placeholder="Enter number of questions">
        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz-container"></div>
    <button id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit</button>
    <h2 id="result"></h2>
    <button id="retry-btn" onclick="restartQuiz()" style="display:none;">Give Test Again</button>

    <p class="footer">
    Made with <span>❤️</span> by Aakash Mahatha
    </p>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

        // Initialize Firestore
        const db = firebase.firestore();

        const analytics = firebase.analytics();

    <script src="script.js"></script>
</body>
</html>
